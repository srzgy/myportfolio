{% extends "base.html" %}
{% block meta %}
    <title>Edit Education - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="education-section">
            <div class="container">
                <h1>Edit Education</h1>
                <form id="edit-education-form"
                      method="post"
                      class="education-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="button">Edit Education</button>
                    <a href="{% url 'main:show_education' %}" class="button button-secondary">Cancel</a>
                </form>
            </div>
        </section>
    </main>

<script>
const DETAIL_EDUCATION_ENDPOINT = "{% url 'api:education-detail' education.id %}";
const REDIRECT_URL = "{% url 'main:show_education' %}";
const editForm = document.getElementById('edit-education-form');

function getCookie(name) {
    const prefix = `${name}=`;
    const cookie = document.cookie.split(';').map(value => value.trim())
        .find(value => value.startsWith(prefix));
    return cookie ? decodeURIComponent(cookie.slice(prefix.length)) : null;
}

function apiErrorMessage(data, status) {
    const messages = Object.values(data).flat().filter(value => typeof value === 'string');
    return messages.join(' ') || `Request failed (HTTP ${status}).`;
}

editForm.addEventListener('submit', async function(event) {
    event.preventDefault();
    const submitButton = editForm.querySelector('button[type="submit"]');
    submitButton.disabled = true;

    try {
        const fields = new FormData(editForm);
        const payload = {
            institution: fields.get('institution'),
            degree: fields.get('degree'),
            description: fields.get('description'),
            thumbnail: fields.get('thumbnail') || "",
        };

        const response = await fetch(DETAIL_EDUCATION_ENDPOINT, {
            method: 'PATCH',
            headers: {
                Accept: 'application/json',
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
            },
            body: JSON.stringify(payload),
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(apiErrorMessage(data, response.status));

        window.location.href = REDIRECT_URL;
    } catch (error) {
        showToast('Failed to update education', error.message, 'error');
        submitButton.disabled = false;
    }
});
</script>
{% endblock content %}
